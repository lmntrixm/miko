<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>مدیریت اشتراک</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>

body{margin:0;font-family:'Vazirmatn',sans-serif;background:#121212;color:#F5F5F5}
a{color:#FF4D4D;text-decoration:none}a:hover{color:#FF7A7A}
button{font-family:inherit;cursor:pointer}

html,body{margin:0;width:390px;min-height:844px}
</style>
</head>
<body>
<div class="sc-host" data-sc-name="ManageSubscription"><div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: rgb(18, 18, 18);">
  <div style="padding: 52px 12px 8px; display: flex; align-items: center; gap: 8px;">
    <a href="Profile.html" aria-label="بازگشت" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: rgb(245, 245, 245);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
    <h1 style="margin: 0px; font-size: 20px; font-weight: 900;">مدیریت اشتراک</h1>
  </div>
  <div style="padding: 6px 20px 0px; display: flex; flex-direction: column; gap: 14px;">
    <div style="padding: 18px; border-radius: 22px; background: linear-gradient(120deg, rgb(110, 0, 0), rgb(192, 0, 0)); display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 12px; color: rgb(255, 214, 214);">طرح فعلی</span>
      <span style="font-size: 20px; font-weight: 900;">سه ماهه</span>
      <span style="font-size: 13px;"><span class="sc-interp">تمدید خودکار در ۶ دی ۱۴۰۵ · [قیمت] تومان</span></span>
    </div>
    <div style="border-radius: 20px; background: rgb(26, 26, 26); border: 1px solid rgb(38, 38, 38); overflow: hidden;">
      <button role="switch" aria-checked="true" style="width: 100%; min-height: 64px; padding: 0px 16px; display: flex; align-items: center; gap: 12px; background: none; border-width: 0px 0px 1px; border-top-style: initial; border-right-style: initial; border-left-style: initial; border-top-color: initial; border-right-color: initial; border-left-color: initial; border-image: initial; border-bottom-style: solid; border-bottom-color: rgb(38, 38, 38); color: rgb(245, 245, 245); text-align: right;">
        <span style="flex-grow: 1; display: flex; flex-direction: column;"><span style="font-size: 14px;">تمدید خودکار</span><span style="font-size: 11px; color: rgb(163, 163, 163);">از کارت ذخیره‌شده در درگاه</span></span>
        <span style="width: 46px; height: 26px; border-radius: 13px; position: relative; flex-shrink: 0; background: rgb(224, 0, 0);"><span style="position: absolute; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: rgb(255, 255, 255); left: 3px;"></span></span>
      </button>
      <a href="Subscription.html" style="min-height: 52px; padding: 0px 16px; display: flex; align-items: center; color: rgb(245, 245, 245); font-size: 14px; border-bottom: 1px solid rgb(38, 38, 38);">تغییر طرح<span style="margin-right: auto; font-size: 12px; color: rgb(163, 163, 163);">سالانه ۳۰٪ ارزان‌تر</span></a>
      <a href="PaymentHistory.html" style="min-height: 52px; padding: 0px 16px; display: flex; align-items: center; color: rgb(245, 245, 245); font-size: 14px;">تاریخچه پرداخت‌ها</a>
    </div>
  </div>

  </div></div>
</body>
</html>
