<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>شخصی‌سازی اولیه</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>

body{margin:0;font-family:'Vazirmatn',sans-serif;background:#121212;color:#F5F5F5}
a{color:#FF4D4D;text-decoration:none}a:hover{color:#FF7A7A}
button{font-family:inherit;cursor:pointer}

html,body{margin:0;width:390px;min-height:844px}
</style>
</head>
<body>
<div class="sc-host" data-sc-name="OnboardingPrefs"><div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: rgb(18, 18, 18);">
  <div style="padding: 60px 20px 0px; display: flex; flex-direction: column; gap: 18px;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div style="display: flex; gap: 6px;"><span style="width: 26px; height: 6px; border-radius: 3px; background: rgb(224, 0, 0);"></span><span style="width: 26px; height: 6px; border-radius: 3px; background: rgb(224, 0, 0);"></span><span style="width: 26px; height: 6px; border-radius: 3px; background: rgb(58, 58, 58);"></span></div>
      <a href="OrigHome.html" style="font-size: 13px; color: rgb(163, 163, 163); min-height: 36px; display: flex; align-items: center;">رد شدن</a>
    </div>
    <h1 style="margin: 0px; font-size: 24px; font-weight: 900; line-height: 1.5;">چه چیزهایی دوست دارید؟</h1>
    <p style="margin: 0px; font-size: 14px; color: rgb(163, 163, 163);">حداقل ۳ ژانر انتخاب کنید تا صفحه خانه را برایتان بچینیم.</p>

    <div style="display: flex; flex-wrap: wrap; gap: 10px;">
      
        <button aria-pressed="true" style="height: 44px; padding: 0px 16px; border-radius: 14px; font-size: 14px; background: rgb(224, 0, 0); border: 1px solid rgb(224, 0, 0); color: rgb(255, 255, 255); font-weight: 700;"><span class="sc-interp">اکشن</span></button>
      
        <button aria-pressed="true" style="height: 44px; padding: 0px 16px; border-radius: 14px; font-size: 14px; background: rgb(224, 0, 0); border: 1px solid rgb(224, 0, 0); color: rgb(255, 255, 255); font-weight: 700;"><span class="sc-interp">فانتزی</span></button>
      
        <button aria-pressed="false" style="height: 44px; padding: 0px 16px; border-radius: 14px; font-size: 14px; background: rgb(30, 30, 30); border: 1px solid rgb(51, 51, 51); color: rgb(212, 212, 212);"><span class="sc-interp">عاشقانه</span></button>
      
        <button aria-pressed="false" style="height: 44px; padding: 0px 16px; border-radius: 14px; font-size: 14px; background: rgb(30, 30, 30); border: 1px solid rgb(51, 51, 51); color: rgb(212, 212, 212);"><span class="sc-interp">کمدی</span></button>
      
        <button aria-pressed="false" style="height: 44px; padding: 0px 16px; border-radius: 14px; font-size: 14px; background: rgb(30, 30, 30); border: 1px solid rgb(51, 51, 51); color: rgb(212, 212, 212);"><span class="sc-interp">ترسناک</span></button>
      
        <button aria-pressed="false" style="height: 44px; padding: 0px 16px; border-radius: 14px; font-size: 14px; background: rgb(30, 30, 30); border: 1px solid rgb(51, 51, 51); color: rgb(212, 212, 212);"><span class="sc-interp">ورزشی</span></button>
      
        <button aria-pressed="false" style="height: 44px; padding: 0px 16px; border-radius: 14px; font-size: 14px; background: rgb(30, 30, 30); border: 1px solid rgb(51, 51, 51); color: rgb(212, 212, 212);"><span class="sc-interp">معمایی</span></button>
      
        <button aria-pressed="false" style="height: 44px; padding: 0px 16px; border-radius: 14px; font-size: 14px; background: rgb(30, 30, 30); border: 1px solid rgb(51, 51, 51); color: rgb(212, 212, 212);"><span class="sc-interp">ابرقهرمانی</span></button>
      
        <button aria-pressed="false" style="height: 44px; padding: 0px 16px; border-radius: 14px; font-size: 14px; background: rgb(30, 30, 30); border: 1px solid rgb(51, 51, 51); color: rgb(212, 212, 212);"><span class="sc-interp">زندگی روزمره</span></button>
      
        <button aria-pressed="false" style="height: 44px; padding: 0px 16px; border-radius: 14px; font-size: 14px; background: rgb(30, 30, 30); border: 1px solid rgb(51, 51, 51); color: rgb(212, 212, 212);"><span class="sc-interp">تاریخی</span></button>
      
        <button aria-pressed="false" style="height: 44px; padding: 0px 16px; border-radius: 14px; font-size: 14px; background: rgb(30, 30, 30); border: 1px solid rgb(51, 51, 51); color: rgb(212, 212, 212);"><span class="sc-interp">علمی‌تخیلی</span></button>
      
        <button aria-pressed="false" style="height: 44px; padding: 0px 16px; border-radius: 14px; font-size: 14px; background: rgb(30, 30, 30); border: 1px solid rgb(51, 51, 51); color: rgb(212, 212, 212);"><span class="sc-interp">روان‌شناختی</span></button>
      
    </div>

    <span style="font-size: 15px; font-weight: 900; margin-top: 6px;">زبان ترجیحی خواندن</span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0px, 1fr)); gap: 8px;">
      
        <button role="radio" aria-checked="true" style="height: 64px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: rgb(245, 245, 245); background: rgb(31, 11, 11); border: 1.5px solid rgb(224, 0, 0);"><span style="font-size: 14px; font-weight: 700;"><span class="sc-interp">فارسی</span></span><span style="font-size: 11px; color: rgb(163, 163, 163);"><span class="sc-interp">پیش‌فرض</span></span></button>
      
        <button role="radio" aria-checked="false" style="height: 64px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: rgb(245, 245, 245); background: rgb(26, 26, 26); border: 1.5px solid rgb(42, 42, 42);"><span style="font-size: 14px; font-weight: 700;"><span class="sc-interp">English</span></span><span style="font-size: 11px; color: rgb(163, 163, 163);"><span class="sc-interp">انگلیسی</span></span></button>
      
        <button role="radio" aria-checked="false" style="height: 64px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: rgb(245, 245, 245); background: rgb(26, 26, 26); border: 1.5px solid rgb(42, 42, 42);"><span style="font-size: 14px; font-weight: 700;"><span class="sc-interp">هر دو</span></span><span style="font-size: 11px; color: rgb(163, 163, 163);"><span class="sc-interp">کنار هم</span></span></button>
      
    </div>
  </div>
  <div style="position: absolute; left: 20px; right: 20px; bottom: 34px; display: flex; flex-direction: column; gap: 8px; align-items: center;">
    <span style="font-size: 12px; color: rgb(163, 163, 163);"><span class="sc-interp">۱ ژانر دیگر انتخاب کنید</span></span>
    <a href="OrigHome.html" style="width: 100%; height: 56px; border-radius: 18px; font-size: 16px; font-weight: 900; display: flex; align-items: center; justify-content: center; background: rgb(58, 26, 26); color: rgb(140, 140, 140); pointer-events: none;">ادامه</a>
  </div></div></div>
</body>
</html>
