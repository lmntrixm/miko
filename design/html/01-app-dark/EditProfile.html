<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>ویرایش پروفایل</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>

body{margin:0;font-family:'Vazirmatn',sans-serif;background:#121212;color:#F5F5F5}
a{color:#FF4D4D;text-decoration:none}a:hover{color:#FF7A7A}
button,input{font-family:inherit}
button{cursor:pointer}

html,body{margin:0;width:390px;min-height:844px}
</style>
</head>
<body>
<div class="sc-host" data-sc-name="EditProfile"><div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: rgb(18, 18, 18);">
  <div style="padding: 52px 12px 8px; display: flex; align-items: center; gap: 8px;">
    <a href="Profile.html" aria-label="بازگشت" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: rgb(245, 245, 245);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
    <h1 style="margin: 0px; font-size: 20px; font-weight: 900; flex-grow: 1;">ویرایش پروفایل</h1>
  </div>
  <div style="padding: 8px 20px 0px; display: flex; flex-direction: column; gap: 22px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <span style="position: relative; width: 88px; height: 88px; border-radius: 26px; background: linear-gradient(135deg, rgb(142, 0, 0), rgb(230, 0, 0)); display: flex; align-items: center; justify-content: center; color: rgb(255, 255, 255);">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
        <button aria-label="تغییر تصویر" style="position: absolute; bottom: -6px; left: -6px; width: 36px; height: 36px; border-radius: 12px; background: rgb(36, 36, 36); border: 2px solid rgb(18, 18, 18); color: rgb(255, 255, 255); display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></button>
      </span>
    </div>
    <label style="position: relative; height: 62px; border-radius: 26px; border: 1px solid rgb(200, 16, 46); display: flex; align-items: center; padding: 0px 20px;">
      <span style="position: absolute; top: -11px; right: 22px; padding: 0px 8px; background: rgb(18, 18, 18); font-size: 13px;">نام و نام خانوادگی</span>
      <input value="امیر حسین جعفری" style="flex-grow: 1; min-width: 0px; background: transparent; border: 0px; outline: none; color: rgb(245, 245, 245); font-size: 15px;">
    </label>
    <label style="position: relative; height: 62px; border-radius: 26px; border: 1px solid rgb(51, 51, 51); display: flex; align-items: center; gap: 10px; padding: 0px 20px;">
      <span style="position: absolute; top: -11px; right: 22px; padding: 0px 8px; background: rgb(18, 18, 18); font-size: 13px; color: rgb(163, 163, 163);">ایمیل</span>
      <input dir="ltr" disabled="" value="jafariamirhossein30@gmail.com" style="flex-grow: 1; min-width: 0px; background: transparent; border: 0px; color: rgb(140, 140, 140); font-size: 14px;">
      <span style="font-size: 11px; color: rgb(74, 222, 128);">تأییدشده</span>
    </label>

    <div style="border-radius: 20px; background: rgb(26, 26, 26); border: 1px solid rgb(38, 38, 38); overflow: hidden;">
      <button style="width: 100%; min-height: 56px; padding: 0px 16px; display: flex; align-items: center; gap: 12px; background: none; border: 0px; color: rgb(245, 245, 245); font-size: 14px; text-align: right;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="5" y="10" width="14" height="10" rx="3"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
        <span style="flex-grow: 1;">تغییر رمز عبور</span>
        <span style="font-size: 18px; color: rgb(163, 163, 163);"><span class="sc-interp">−</span></span>
      </button>
      
        <div style="padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 10px;">
          <input type="password" placeholder="رمز فعلی" style="height: 46px; border-radius: 14px; background: rgb(20, 20, 20); border: 1px solid rgb(46, 46, 46); color: rgb(245, 245, 245); padding: 0px 14px; font-size: 14px;">
          <input type="password" placeholder="رمز جدید (حداقل ۸ کاراکتر)" style="height: 46px; border-radius: 14px; background: rgb(20, 20, 20); border: 1px solid rgb(46, 46, 46); color: rgb(245, 245, 245); padding: 0px 14px; font-size: 14px;">
          <input type="password" placeholder="تکرار رمز جدید" style="height: 46px; border-radius: 14px; background: rgb(20, 20, 20); border: 1px solid rgb(46, 46, 46); color: rgb(245, 245, 245); padding: 0px 14px; font-size: 14px;">
        </div>
      
    </div>
    <button style="background: none; border: 0px; color: rgb(255, 107, 107); font-size: 13px; min-height: 40px; align-self: flex-start;">حذف دائمی حساب کاربری</button>
  </div>
  <div style="position: absolute; left: 20px; right: 20px; bottom: 30px;">
    <button style="width: 100%; height: 56px; border-radius: 18px; border: 0px; background: linear-gradient(90deg, rgb(142, 0, 0), rgb(230, 0, 0)); color: rgb(255, 255, 255); font-size: 16px; font-weight: 900;"><span class="sc-interp">ذخیره تغییرات</span></button>
  </div></div></div>
</body>
</html>
