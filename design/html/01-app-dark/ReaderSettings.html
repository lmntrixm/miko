<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>تنظیمات خواندن</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>

body{margin:0;font-family:'Vazirmatn',sans-serif;background:#000;color:#F5F5F5}
a{color:#FF4D4D;text-decoration:none}a:hover{color:#FF7A7A}
button{font-family:inherit;cursor:pointer}
.pn{background-color:#D6D6D6;border:2px solid #1A1A1A}
input[type=range]{accent-color:#E00000}

html,body{margin:0;width:390px;min-height:844px}
</style>
</head>
<body>
<div class="sc-host" data-sc-name="ReaderSettings"><div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: rgb(10, 10, 10);">
  <div aria-hidden="true" style="position: absolute; inset: 0px; background: rgb(239, 239, 239); padding: 14px; box-sizing: border-box; display: grid; grid-template-columns: repeat(2, minmax(0px, 1fr)); grid-template-rows: 220px 180px 200px 180px; gap: 8px;">
    <span class="pn" style="grid-column: span 2;"></span><span class="pn"></span><span class="pn"></span><span class="pn" style="grid-column: span 2;"></span><span class="pn"></span><span class="pn"></span>
  </div>
  <a href="Reader.html" aria-label="بستن تنظیمات" style="position: absolute; inset: 0px; background: rgba(0, 0, 0, 0.72);"></a>

  <div role="dialog" aria-label="تنظیمات خواندن" style="position: absolute; left: 0px; right: 0px; bottom: 0px; background: rgb(22, 22, 22); border-radius: 28px 28px 0px 0px; border-top: 1px solid rgba(224, 0, 0, 0.333); padding: 12px 20px 34px; display: flex; flex-direction: column; gap: 18px;">
    <div style="width: 44px; height: 5px; border-radius: 3px; background: rgb(58, 58, 58); align-self: center;"></div>
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2 style="margin: 0px; font-size: 18px; font-weight: 900;">تنظیمات خواندن</h2>
      <a href="Reader.html" aria-label="بستن" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: rgb(189, 189, 189);"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 13px; color: rgb(163, 163, 163);">حالت خواندن</span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0px, 1fr)); gap: 8px;">
        
          <button style="height: 64px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: rgb(245, 245, 245); background: rgb(42, 10, 10); border: 1.5px solid rgb(224, 0, 0);">
            <span style="font-size: 13px; font-weight: 700;"><span class="sc-interp">عمودی</span></span>
            <span style="font-size: 10px; color: rgb(163, 163, 163);"><span class="sc-interp">اسکرول پیوسته</span></span>
          </button>
        
          <button style="height: 64px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: rgb(245, 245, 245); background: rgb(30, 30, 30); border: 1.5px solid rgb(42, 42, 42);">
            <span style="font-size: 13px; font-weight: 700;"><span class="sc-interp">صفحه‌ای</span></span>
            <span style="font-size: 10px; color: rgb(163, 163, 163);"><span class="sc-interp">ورق زدن</span></span>
          </button>
        
          <button style="height: 64px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: rgb(245, 245, 245); background: rgb(30, 30, 30); border: 1.5px solid rgb(42, 42, 42);">
            <span style="font-size: 13px; font-weight: 700;"><span class="sc-interp">وبتون</span></span>
            <span style="font-size: 10px; color: rgb(163, 163, 163);"><span class="sc-interp">بدون فاصله</span></span>
          </button>
        
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 13px; color: rgb(163, 163, 163);">جهت ورق زدن</span>
      <div style="display: flex; gap: 8px;">
        
          <button style="flex-grow: 1; height: 44px; border-radius: 12px; font-size: 13px; background: rgb(224, 0, 0); border: 0px; color: rgb(255, 255, 255); font-weight: 700;"><span class="sc-interp">راست به چپ (مانگا)</span></button>
        
          <button style="flex-grow: 1; height: 44px; border-radius: 12px; font-size: 13px; background: rgb(30, 30, 30); border: 1px solid rgb(46, 46, 46); color: rgb(212, 212, 212);"><span class="sc-interp">چپ به راست (کامیک)</span></button>
        
      </div>
    </div>

    <label style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 13px; color: rgb(163, 163, 163); display: flex; justify-content: space-between;"><span>روشنایی</span><span>۷۰٪</span></span>
      <input type="range" min="0" max="100" value="70" style="width: 100%; margin: 0px;">
    </label>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 13px; color: rgb(163, 163, 163);">کیفیت تصویر</span>
      <div style="display: flex; gap: 8px;">
        
          <button style="flex-grow: 1; height: 44px; border-radius: 12px; font-size: 13px; background: rgb(30, 30, 30); border: 1px solid rgb(46, 46, 46); color: rgb(212, 212, 212);"><span class="sc-interp">کم‌حجم</span></button>
        
          <button style="flex-grow: 1; height: 44px; border-radius: 12px; font-size: 13px; background: rgb(30, 30, 30); border: 1px solid rgb(46, 46, 46); color: rgb(212, 212, 212);"><span class="sc-interp">متوسط</span></button>
        
          <button style="flex-grow: 1; height: 44px; border-radius: 12px; font-size: 13px; background: rgb(224, 0, 0); border: 0px; color: rgb(255, 255, 255); font-weight: 700;"><span class="sc-interp">اصلی</span></button>
        
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px;">
      
        <button role="switch" aria-checked="true" style="min-height: 48px; display: flex; justify-content: space-between; align-items: center; background: none; border: 0px; color: rgb(245, 245, 245); font-size: 14px; padding: 0px;">
          <span><span class="sc-interp">روشن ماندن صفحه هنگام خواندن</span></span>
          <span style="width: 46px; height: 26px; border-radius: 13px; position: relative; flex-shrink: 0; background: rgb(224, 0, 0);"><span style="position: absolute; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: rgb(255, 255, 255); left: 3px;"></span></span>
        </button>
      
        <button role="switch" aria-checked="true" style="min-height: 48px; display: flex; justify-content: space-between; align-items: center; background: none; border: 0px; color: rgb(245, 245, 245); font-size: 14px; padding: 0px;">
          <span><span class="sc-interp">رفتن خودکار به چپتر بعدی</span></span>
          <span style="width: 46px; height: 26px; border-radius: 13px; position: relative; flex-shrink: 0; background: rgb(224, 0, 0);"><span style="position: absolute; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: rgb(255, 255, 255); left: 3px;"></span></span>
        </button>
      
    </div>

    <a href="Reader.html" style="height: 56px; border-radius: 18px; background: linear-gradient(90deg, rgb(142, 0, 0), rgb(230, 0, 0)); color: rgb(255, 255, 255); font-size: 17px; font-weight: 900; display: flex; align-items: center; justify-content: center;">اعمال تنظیمات</a>
    <a href="ReportProblem.html" style="align-self: center; font-size: 13px; min-height: 36px; display: flex; align-items: center;">گزارش مشکل همین صفحه</a>
  </div></div></div>
</body>
</html>
