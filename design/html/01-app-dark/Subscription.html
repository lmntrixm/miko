<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>خرید اشتراک</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>

body{margin:0;font-family:'Vazirmatn',sans-serif;background:#121212;color:#F5F5F5}
a{color:#FF4D4D;text-decoration:none}a:hover{color:#FF7A7A}
button,input{font-family:inherit;cursor:pointer}
input::placeholder{color:#8C8C8C}

html,body{margin:0;width:390px;min-height:844px}
</style>
</head>
<body>
<div class="sc-host" data-sc-name="Subscription"><div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: rgb(18, 18, 18);">
  <div style="padding: 52px 12px 0px; display: flex; align-items: center; gap: 8px;">
    <a href="Profile.html" aria-label="بازگشت" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: rgb(245, 245, 245);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
    <h1 style="margin: 0px; font-size: 20px; font-weight: 900;">خرید اشتراک</h1>
  </div>

  <div style="padding: 12px 20px 0px; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0px, 1fr)); gap: 8px;">
      
        <div style="display: flex; gap: 8px; align-items: center; font-size: 13px; color: rgb(229, 229, 229); padding: 10px; border-radius: 14px; background: rgb(27, 27, 27);">
          <span style="width: 24px; height: 24px; border-radius: 8px; background: rgb(42, 10, 10); color: rgb(255, 77, 77); display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"></path></svg></span>
          <span class="sc-interp">همه چپترها</span>
        </div>
      
        <div style="display: flex; gap: 8px; align-items: center; font-size: 13px; color: rgb(229, 229, 229); padding: 10px; border-radius: 14px; background: rgb(27, 27, 27);">
          <span style="width: 24px; height: 24px; border-radius: 8px; background: rgb(42, 10, 10); color: rgb(255, 77, 77); display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"></path></svg></span>
          <span class="sc-interp">دانلود آفلاین</span>
        </div>
      
        <div style="display: flex; gap: 8px; align-items: center; font-size: 13px; color: rgb(229, 229, 229); padding: 10px; border-radius: 14px; background: rgb(27, 27, 27);">
          <span style="width: 24px; height: 24px; border-radius: 8px; background: rgb(42, 10, 10); color: rgb(255, 77, 77); display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"></path></svg></span>
          <span class="sc-interp">فارسی و انگلیسی</span>
        </div>
      
        <div style="display: flex; gap: 8px; align-items: center; font-size: 13px; color: rgb(229, 229, 229); padding: 10px; border-radius: 14px; background: rgb(27, 27, 27);">
          <span style="width: 24px; height: 24px; border-radius: 8px; background: rgb(42, 10, 10); color: rgb(255, 77, 77); display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"></path></svg></span>
          <span class="sc-interp">بدون تبلیغات</span>
        </div>
      
    </div>

    <div role="radiogroup" aria-label="انتخاب طرح" style="display: flex; flex-direction: column; gap: 10px;">
      
        <button role="radio" aria-checked="false" style="min-height: 72px; padding: 12px 14px; border-radius: 18px; display: flex; align-items: center; gap: 12px; text-align: right; background: rgb(27, 27, 27); border: 1.5px solid rgb(42, 42, 42);">
          <span style="width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; box-sizing: border-box; border: 2px solid rgb(90, 90, 90);"></span>
          <span style="flex-grow: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 2px;">
            <span style="display: flex; gap: 8px; align-items: center;">
              <span style="font-size: 16px; font-weight: 900; color: rgb(245, 245, 245);"><span class="sc-interp">یک ماهه</span></span>
              
            </span>
            <span style="font-size: 12px; color: rgb(163, 163, 163);"><span class="sc-interp">۳۰ روز دسترسی کامل</span></span>
          </span>
          <span style="font-size: 15px; font-weight: 900; color: rgb(245, 245, 245);"><span class="sc-interp">[قیمت] تومان</span></span>
        </button>
      
        <button role="radio" aria-checked="true" style="min-height: 72px; padding: 12px 14px; border-radius: 18px; display: flex; align-items: center; gap: 12px; text-align: right; background: rgb(31, 11, 11); border: 1.5px solid rgb(224, 0, 0);">
          <span style="width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; box-sizing: border-box; border: 6px solid rgb(224, 0, 0); background: rgb(255, 255, 255);"></span>
          <span style="flex-grow: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 2px;">
            <span style="display: flex; gap: 8px; align-items: center;">
              <span style="font-size: 16px; font-weight: 900; color: rgb(245, 245, 245);"><span class="sc-interp">سه ماهه</span></span>
              
                <span style="font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: rgb(224, 0, 0); color: rgb(255, 255, 255);"><span class="sc-interp">محبوب</span></span>
              
            </span>
            <span style="font-size: 12px; color: rgb(163, 163, 163);"><span class="sc-interp">۹۰ روز · [درصد] تخفیف</span></span>
          </span>
          <span style="font-size: 15px; font-weight: 900; color: rgb(245, 245, 245);"><span class="sc-interp">[قیمت] تومان</span></span>
        </button>
      
        <button role="radio" aria-checked="false" style="min-height: 72px; padding: 12px 14px; border-radius: 18px; display: flex; align-items: center; gap: 12px; text-align: right; background: rgb(27, 27, 27); border: 1.5px solid rgb(42, 42, 42);">
          <span style="width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; box-sizing: border-box; border: 2px solid rgb(90, 90, 90);"></span>
          <span style="flex-grow: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 2px;">
            <span style="display: flex; gap: 8px; align-items: center;">
              <span style="font-size: 16px; font-weight: 900; color: rgb(245, 245, 245);"><span class="sc-interp">سالانه</span></span>
              
            </span>
            <span style="font-size: 12px; color: rgb(163, 163, 163);"><span class="sc-interp">۳۶۵ روز · بیشترین صرفه‌جویی</span></span>
          </span>
          <span style="font-size: 15px; font-weight: 900; color: rgb(245, 245, 245);"><span class="sc-interp">[قیمت] تومان</span></span>
        </button>
      
    </div>

    <div style="display: flex; gap: 8px;">
      <label style="flex-grow: 1; height: 48px; border-radius: 14px; background: rgb(30, 30, 30); border: 1px dashed rgb(58, 58, 58); display: flex; align-items: center; padding: 0px 14px;">
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden;">کد تخفیف</span>
        <input placeholder="کد تخفیف دارید؟" style="flex-grow: 1; min-width: 0px; background: transparent; border: 0px; outline: none; color: rgb(245, 245, 245); font-size: 14px;">
      </label>
      <button style="height: 48px; padding: 0px 18px; border-radius: 14px; background: rgb(38, 38, 38); border: 0px; color: rgb(245, 245, 245); font-size: 14px;">اعمال</button>
    </div>

    <div style="display: flex; justify-content: space-between; font-size: 14px; padding: 4px 2px;">
      <span style="color: rgb(163, 163, 163);">مبلغ قابل پرداخت</span>
      <span style="font-weight: 900;"><span class="sc-interp">[قیمت] تومان</span></span>
    </div>

    <a href="PaymentPending.html" style="height: 58px; border-radius: 18px; background: linear-gradient(90deg, rgb(142, 0, 0), rgb(230, 0, 0)); border: 0px; color: rgb(255, 255, 255); font-size: 17px; font-weight: 900; display: flex; align-items: center; justify-content: center;">پرداخت از درگاه بانکی</a>
    <span style="font-size: 11px; color: rgb(140, 140, 140); text-align: center;">پرداخت امن · امکان لغو تمدید خودکار در هر زمان</span>
  </div></div></div>
</body>
</html>
