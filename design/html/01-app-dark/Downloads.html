<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>

body{margin:0;font-family:'Vazirmatn',sans-serif;background:#121212;color:#F5F5F5}
a{color:#FF4D4D;text-decoration:none}a:hover{color:#FF7A7A}
button{font-family:inherit;cursor:pointer}
.ph{background-color:#262626;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 6px,transparent 6px 14px)}

html,body{margin:0;width:390px;min-height:844px}
</style>
</head>
<body>
<div class="sc-host" data-sc-name="Downloads"><div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: rgb(18, 18, 18);">
  <div style="padding: 52px 12px 8px; display: flex; align-items: center; gap: 8px;">
    <a href="Library.html" aria-label="بازگشت" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: rgb(245, 245, 245);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
    <h1 style="margin: 0px; font-size: 20px; font-weight: 900; flex-grow: 1;">دانلودها</h1>
    <button style="height: 36px; padding: 0px 12px; border-radius: 10px; background: rgb(30, 30, 30); border: 1px solid rgb(46, 46, 46); color: rgb(245, 245, 245); font-size: 12px;"><span class="sc-interp">توقف همه</span></button>
  </div>

  <div style="padding: 0px 20px; display: flex; flex-direction: column; gap: 14px;">
    <div style="padding: 14px; border-radius: 18px; background: rgb(26, 26, 26); border: 1px solid rgb(38, 38, 38); display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; justify-content: space-between; font-size: 13px;"><span>فضای استفاده‌شده</span><span style="color: rgb(163, 163, 163);">۱.۲ از ۴ گیگابایت مجاز</span></div>
      <div style="height: 8px; border-radius: 4px; background: rgb(51, 51, 51); display: flex; overflow: hidden; direction: rtl;"><span style="width: 30%; background: rgb(224, 0, 0);"></span><span style="width: 8%; background: rgb(142, 0, 0);"></span></div>
      <div style="display: flex; gap: 14px; font-size: 11px; color: rgb(163, 163, 163);"><span style="display: flex; gap: 4px; align-items: center;"><span style="width: 8px; height: 8px; border-radius: 2px; background: rgb(224, 0, 0);"></span>دانلودشده</span><span style="display: flex; gap: 4px; align-items: center;"><span style="width: 8px; height: 8px; border-radius: 2px; background: rgb(142, 0, 0);"></span>در صف</span></div>
    </div>

    <span style="font-size: 14px; font-weight: 900;">در حال دانلود</span>
    
      <div style="display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 16px; background: rgb(27, 27, 27);">
        <span class="ph" style="width: 44px; height: 60px; border-radius: 8px; flex-shrink: 0;"></span>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 5px;">
          <span style="font-size: 14px; font-weight: 700;"><span class="sc-interp">جوجوتسو کایسن · ۲۴۳</span></span>
          <div style="height: 5px; border-radius: 3px; background: rgb(51, 51, 51); position: relative; overflow: hidden;"><div style="position: absolute; right: 0px; top: 0px; bottom: 0px; width: 64%; background: rgb(224, 0, 0);"></div></div>
          <span style="font-size: 11px; color: rgb(163, 163, 163);"><span class="sc-interp">۲۸ از ۴۴ مگابایت · ۱۲ ثانیه</span></span>
        </div>
        <button aria-label="لغو دانلود جوجوتسو کایسن · ۲۴۳" style="width: 40px; height: 40px; border-radius: 12px; background: rgb(36, 36, 36); border: 0px; color: rgb(189, 189, 189); display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
      </div>
    
      <div style="display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 16px; background: rgb(27, 27, 27);">
        <span class="ph" style="width: 44px; height: 60px; border-radius: 8px; flex-shrink: 0;"></span>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 5px;">
          <span style="font-size: 14px; font-weight: 700;"><span class="sc-interp">وان پیس · ۱۰۹۸</span></span>
          <div style="height: 5px; border-radius: 3px; background: rgb(51, 51, 51); position: relative; overflow: hidden;"><div style="position: absolute; right: 0px; top: 0px; bottom: 0px; width: 0%; background: rgb(224, 0, 0);"></div></div>
          <span style="font-size: 11px; color: rgb(163, 163, 163);"><span class="sc-interp">در صف</span></span>
        </div>
        <button aria-label="لغو دانلود وان پیس · ۱۰۹۸" style="width: 40px; height: 40px; border-radius: 12px; background: rgb(36, 36, 36); border: 0px; color: rgb(189, 189, 189); display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
      </div>
    
      <div style="display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 16px; background: rgb(27, 27, 27);">
        <span class="ph" style="width: 44px; height: 60px; border-radius: 8px; flex-shrink: 0;"></span>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 5px;">
          <span style="font-size: 14px; font-weight: 700;"><span class="sc-interp">کاگوراباچی · ۸</span></span>
          <div style="height: 5px; border-radius: 3px; background: rgb(51, 51, 51); position: relative; overflow: hidden;"><div style="position: absolute; right: 0px; top: 0px; bottom: 0px; width: 0%; background: rgb(224, 0, 0);"></div></div>
          <span style="font-size: 11px; color: rgb(163, 163, 163);"><span class="sc-interp">در صف</span></span>
        </div>
        <button aria-label="لغو دانلود کاگوراباچی · ۸" style="width: 40px; height: 40px; border-radius: 12px; background: rgb(36, 36, 36); border: 0px; color: rgb(189, 189, 189); display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
      </div>
    

    <span style="font-size: 14px; font-weight: 900; margin-top: 4px;">دانلودشده</span>
    
      <div style="display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 16px; background: rgb(27, 27, 27);">
        <span class="ph" style="width: 44px; height: 60px; border-radius: 8px; flex-shrink: 0;"></span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px;"><span style="font-size: 14px; font-weight: 700;"><span class="sc-interp">وان پیس</span></span><span style="font-size: 11px; color: rgb(163, 163, 163);"><span class="sc-interp">۱۲ چپتر · ۴۸۰ مگابایت · تا پایان اشتراک</span></span></span>
        <button aria-label="حذف دانلودهای وان پیس" style="width: 40px; height: 40px; border-radius: 12px; background: rgb(36, 36, 36); border: 0px; color: rgb(255, 107, 107); display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg></button>
      </div>
    
      <div style="display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 16px; background: rgb(27, 27, 27);">
        <span class="ph" style="width: 44px; height: 60px; border-radius: 8px; flex-shrink: 0;"></span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px;"><span style="font-size: 14px; font-weight: 700;"><span class="sc-interp">جوجوتسو کایسن</span></span><span style="font-size: 11px; color: rgb(163, 163, 163);"><span class="sc-interp">۲۰ چپتر · ۷۲۰ مگابایت</span></span></span>
        <button aria-label="حذف دانلودهای جوجوتسو کایسن" style="width: 40px; height: 40px; border-radius: 12px; background: rgb(36, 36, 36); border: 0px; color: rgb(255, 107, 107); display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg></button>
      </div>
    

    <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-radius: 14px; background: rgb(26, 26, 26); font-size: 13px;">
      <span>فقط با وای‌فای دانلود شود</span>
      <span style="width: 44px; height: 26px; border-radius: 13px; background: rgb(224, 0, 0); position: relative;"><span style="position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: rgb(255, 255, 255);"></span></span>
    </div>
  </div></div></div>
</body>
</html>
