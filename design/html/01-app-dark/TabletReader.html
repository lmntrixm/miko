<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1194">
<title>خواننده تبلت — دو صفحه‌ای</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>

body{margin:0;font-family:'Vazirmatn',sans-serif;background:#0A0A0A;color:#F5F5F5}
a{color:#FF4D4D;text-decoration:none}a:hover{color:#FF7A7A}
button{font-family:inherit;cursor:pointer}
.pn{background-color:#D6D6D6;background-image:repeating-linear-gradient(135deg,rgba(0,0,0,.05) 0 6px,transparent 6px 14px);border:2px solid #1A1A1A;display:flex;align-items:center;justify-content:center;color:#6B6B6B;font-size:13px}

html,body{margin:0;width:1194px;min-height:834px}
</style>
</head>
<body>
<div class="sc-host" data-sc-name="TabletReader"><div dir="rtl" style="width: 1194px; height: 834px; position: relative; overflow: hidden; background: rgb(10, 10, 10);">
  <div style="position: absolute; top: 70px; bottom: 90px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px;">
    <span style="width: 520px; height: 674px; background: rgb(239, 239, 239); padding: 16px; box-sizing: border-box; display: grid; grid-template-columns: repeat(2, minmax(0px, 1fr)); grid-template-rows: 1fr 1fr 1.2fr; gap: 10px;">
      <span class="pn" style="grid-column: span 2;">صفحه ۴ (راست)</span><span class="pn">پنل</span><span class="pn">پنل</span><span class="pn" style="grid-column: span 2;">پنل</span>
    </span>
    <span style="width: 520px; height: 674px; background: rgb(239, 239, 239); padding: 16px; box-sizing: border-box; display: grid; grid-template-columns: repeat(3, minmax(0px, 1fr)); grid-template-rows: 1.2fr 1fr; gap: 10px;">
      <span class="pn">صفحه ۵ (چپ)</span><span class="pn" style="grid-column: span 2;">پنل</span><span class="pn" style="grid-column: span 3;">پنل</span>
    </span>
  </div>
  <div style="position: absolute; top: 0px; left: 0px; right: 0px; height: 62px; padding: 0px 20px; background: rgba(10, 10, 10, 0.94); border-bottom: 1px solid rgb(38, 38, 38); display: flex; align-items: center; gap: 12px;">
    <a href="OrigDetail.html" aria-label="بازگشت" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: rgb(255, 255, 255);"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
    <span style="font-size: 16px; font-weight: 900;">جوجوتسو کایسن · چپتر ۲۴۲</span>
    <div style="margin-right: auto; display: flex; gap: 8px; align-items: center;">
      <div role="group" aria-label="چیدمان" style="display: flex; background: rgb(30, 30, 30); border-radius: 10px; padding: 3px;">
        <button style="height: 34px; padding: 0px 12px; border: 0px; border-radius: 8px; font-size: 12px; background: rgb(224, 0, 0); color: rgb(255, 255, 255); font-weight: 700;"><span class="sc-interp">دو صفحه</span></button><button style="height: 34px; padding: 0px 12px; border: 0px; border-radius: 8px; font-size: 12px; background: transparent; color: rgb(163, 163, 163);"><span class="sc-interp">تک صفحه</span></button>
      </div>
      <div role="group" aria-label="زبان" style="display: flex; background: rgb(30, 30, 30); border-radius: 10px; padding: 3px;"><button style="height: 34px; padding: 0px 12px; border: 0px; border-radius: 8px; background: rgb(224, 0, 0); color: rgb(255, 255, 255); font-size: 12px; font-weight: 700;">FA</button><button style="height: 34px; padding: 0px 12px; border: 0px; border-radius: 8px; background: transparent; color: rgb(163, 163, 163); font-size: 12px;">EN</button></div>
      <a href="ReaderSettings.html" aria-label="تنظیمات" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: rgb(255, 255, 255);"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path><circle cx="16" cy="7" r="2"></circle><circle cx="8" cy="17" r="2"></circle></svg></a>
    </div>
  </div>
  <div style="position: absolute; bottom: 0px; left: 0px; right: 0px; height: 76px; padding: 0px 28px; background: rgba(10, 10, 10, 0.96); border-top: 1px solid rgb(38, 38, 38); display: flex; align-items: center; gap: 16px;">
    <button style="height: 44px; padding: 0px 16px; border-radius: 12px; background: rgb(30, 30, 30); border: 0px; color: rgb(245, 245, 245); font-size: 13px;">‹ چپتر ۲۴۱</button>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px;"><div style="height: 6px; border-radius: 3px; background: rgb(51, 51, 51); position: relative; overflow: hidden;"><div style="position: absolute; right: 0px; top: 0px; bottom: 0px; width: 28%; background: linear-gradient(270deg, rgb(142, 0, 0), rgb(255, 26, 26));"></div></div><span style="font-size: 11px; color: rgb(163, 163, 163); text-align: center;">صفحه ۴–۵ از ۱۸</span></div>
    <button style="height: 44px; padding: 0px 16px; border-radius: 12px; background: rgb(30, 30, 30); border: 0px; color: rgb(245, 245, 245); font-size: 13px;">چپتر ۲۴۳ ›</button>
  </div></div></div>
</body>
</html>
