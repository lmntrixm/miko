<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>جستجوی بی‌نتیجه</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>

body{margin:0;font-family:'Vazirmatn',sans-serif;background:#121212;color:#F5F5F5}
a{color:#FF4D4D;text-decoration:none}a:hover{color:#FF7A7A}
button,input{font-family:inherit;cursor:pointer}

html,body{margin:0;width:390px;min-height:844px}
</style>
</head>
<body>
<div class="sc-host" data-sc-name="NoResults"><div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: rgb(18, 18, 18);">
  <div style="padding: 60px 20px 0px; display: flex; flex-direction: column; gap: 16px;">
    <label style="height: 52px; border-radius: 16px; background: rgb(30, 30, 30); border: 1px solid rgb(224, 0, 0); display: flex; align-items: center; gap: 10px; padding: 0px 14px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A3A3A3" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden;">جستجو</span>
      <input value="کاگوراباچ" style="flex-grow: 1; min-width: 0px; background: transparent; border: 0px; outline: none; color: rgb(245, 245, 245); font-size: 15px;">
    </label>
    <span style="font-size: 14px; color: rgb(163, 163, 163);">نتیجه‌ای برای «کاگوراباچ» پیدا نشد</span>
  </div>
  <div style="padding: 24px 20px 0px; display: flex; flex-direction: column; gap: 18px;">
    <div style="padding: 18px; border-radius: 20px; background: rgb(26, 26, 26); border: 1px solid rgb(38, 38, 38); display: flex; flex-direction: column; gap: 10px;">
      <span style="font-size: 13px; color: rgb(163, 163, 163);">منظورتان این بود؟</span>
      <a href="OrigDetail.html" style="display: flex; align-items: center; justify-content: space-between; color: rgb(245, 245, 245); font-size: 16px; font-weight: 900; min-height: 44px;">کاگوراباچی <span style="font-size: 12px; color: rgb(255, 77, 77); font-weight: 500;">مشاهده ›</span></a>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: rgb(212, 212, 212);">
      <span style="font-weight: 700; color: rgb(245, 245, 245);">پیشنهادها</span>
      <span>· املای نام را بررسی کنید یا نام انگلیسی را امتحان کنید</span>
      <span>· فیلترهای «فارسی» و «مانگا» را بردارید</span>
    </div>
    <div style="padding: 18px; border-radius: 20px; background: rgb(31, 11, 11); border: 1px dashed rgb(90, 20, 20); display: flex; flex-direction: column; gap: 10px;">
      <span style="font-size: 15px; font-weight: 900;">اثری که دنبالش هستید را نداریم؟</span>
      <span style="font-size: 13px; line-height: 1.9; color: rgb(212, 212, 212);">درخواست ثبت کنید؛ وقتی اضافه شد خبرتان می‌کنیم.</span>
      <button style="height: 46px; border-radius: 14px; background: rgb(224, 0, 0); border: 0px; color: rgb(255, 255, 255); font-size: 14px; font-weight: 700;">درخواست افزودن اثر</button>
    </div>
  </div></div></div>
</body>
</html>
