<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>در حال بارگذاری</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>

body{margin:0;background:#121212}
a{color:#FF4D4D}a:hover{color:#FF7A7A}
.sk{background:linear-gradient(90deg,#1E1E1E 0%,#2A2A2A 50%,#1E1E1E 100%);background-size:200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){.sk{animation:none}}

html,body{margin:0;width:390px;min-height:844px}
</style>
</head>
<body>
<div class="sc-host" data-sc-name="Loading"><div dir="rtl" aria-busy="true" aria-label="در حال بارگذاری صفحه خانه" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: rgb(18, 18, 18);">
  <div style="padding: 70px 20px 0px; display: flex; flex-direction: column; gap: 22px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <span class="sk" style="width: 56px; height: 56px; border-radius: 16px;"></span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px;"><span class="sk" style="width: 60%; height: 16px; border-radius: 6px;"></span><span class="sk" style="width: 80%; height: 12px; border-radius: 6px;"></span></span>
    </div>
    <span class="sk" style="height: 200px; border-radius: 22px;"></span>
    <span class="sk" style="width: 120px; height: 18px; border-radius: 6px;"></span>
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <span class="sk" style="height: 96px; border-radius: 16px;"></span>
      <span class="sk" style="height: 96px; border-radius: 16px;"></span>
      <span class="sk" style="height: 96px; border-radius: 16px;"></span>
    </div>
  </div>
  <div style="position: absolute; left: 0px; right: 0px; bottom: 0px; height: 84px; background: rgb(14, 14, 14); border-top: 1px solid rgb(36, 36, 36);"></div></div></div>
</body>
</html>
