<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>دعوت دوستان و کد هدیه</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>

body{margin:0;font-family:'Vazirmatn',sans-serif;background:#121212;color:#F5F5F5}
a{color:#FF4D4D;text-decoration:none}a:hover{color:#FF7A7A}
button,input{font-family:inherit;cursor:pointer}
input::placeholder{color:#8C8C8C}

html,body{margin:0;width:390px;min-height:844px}
</style>
</head>
<body>
<div class="sc-host" data-sc-name="InviteFriends"><div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: rgb(18, 18, 18);">
  <div style="padding: 52px 12px 8px; display: flex; align-items: center; gap: 8px;">
    <a href="Profile.html" aria-label="بازگشت" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: rgb(245, 245, 245);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
    <h1 style="margin: 0px; font-size: 20px; font-weight: 900;">دعوت و هدیه</h1>
  </div>
  <div style="padding: 4px 20px 0px; display: flex; flex-direction: column; gap: 16px;">
    <div style="padding: 20px; border-radius: 24px; background: linear-gradient(135deg, rgb(110, 0, 0), rgb(192, 0, 0)); display: flex; flex-direction: column; gap: 10px;">
      <b style="font-size: 20px;">هر دوست = ۷ روز رایگان</b>
      <span style="font-size: 13px; line-height: 1.9; color: rgb(255, 228, 228);">وقتی دوستتان با کد شما اولین اشتراکش را بخرد، هر دوی شما ۷ روز اشتراک هدیه می‌گیرید.</span>
      <div style="display: flex; gap: 8px; align-items: center; margin-top: 4px;">
        <span dir="ltr" style="flex-grow: 1; height: 48px; border-radius: 14px; background: rgba(0, 0, 0, 0.35); border: 1px dashed rgba(255, 255, 255, 0.5); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 900; letter-spacing: 2px;">AMIR-7K2Q</span>
        <button style="height: 48px; padding: 0px 16px; border-radius: 14px; background: rgb(255, 255, 255); border: 0px; color: rgb(160, 0, 0); font-size: 14px; font-weight: 900;"><span class="sc-interp">کپی</span></button>
      </div>
      <button style="height: 44px; border-radius: 14px; background: rgba(255, 255, 255, 0.15); border: 0px; color: rgb(255, 255, 255); font-size: 14px;">اشتراک‌گذاری لینک دعوت</button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0px, 1fr)); gap: 10px;">
      <div style="padding: 12px; border-radius: 16px; background: rgb(26, 26, 26); display: flex; flex-direction: column;"><b style="font-size: 20px;">۳</b><span style="font-size: 11px; color: rgb(163, 163, 163);">دوست دعوت‌شده</span></div>
      <div style="padding: 12px; border-radius: 16px; background: rgb(26, 26, 26); display: flex; flex-direction: column;"><b style="font-size: 20px;">۱۴ روز</b><span style="font-size: 11px; color: rgb(163, 163, 163);">هدیه دریافت‌شده</span></div>
    </div>
    <span style="font-size: 15px; font-weight: 900;">کد هدیه دارید؟</span>
    <div style="display: flex; gap: 8px;">
      <label style="flex-grow: 1; height: 50px; border-radius: 16px; background: rgb(30, 30, 30); border: 1px solid rgb(46, 46, 46); display: flex; align-items: center; padding: 0px 14px;"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden;">کد هدیه</span><input dir="ltr" placeholder="GIFT-XXXX" style="flex-grow: 1; min-width: 0px; background: transparent; border: 0px; outline: none; color: rgb(245, 245, 245); font-size: 15px; text-align: right;"></label>
      <button style="height: 50px; padding: 0px 18px; border-radius: 16px; background: rgb(224, 0, 0); border: 0px; color: rgb(255, 255, 255); font-size: 14px; font-weight: 700;">فعال‌سازی</button>
    </div>
    <div style="padding: 14px 16px; border-radius: 18px; background: rgb(26, 26, 26); border: 1px solid rgb(38, 38, 38); display: flex; justify-content: space-between; align-items: center;">
      <span style="display: flex; flex-direction: column;"><b style="font-size: 14px;">اشتراک هدیه بخرید</b><span style="font-size: 11px; color: rgb(163, 163, 163);">برای دوستتان، با پیام شخصی</span></span>
      <a href="Subscription.html" style="font-size: 13px;">خرید ›</a>
    </div>
  </div></div></div>
</body>
</html>
