<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>خواندن چپتر</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>

body{margin:0;font-family:'Vazirmatn',sans-serif;background:#000;color:#F5F5F5}
a{color:#FF4D4D;text-decoration:none}a:hover{color:#FF7A7A}
button{font-family:inherit;cursor:pointer}
.pn{background-color:#D6D6D6;background-image:repeating-linear-gradient(135deg,rgba(0,0,0,.05) 0 6px,transparent 6px 14px);border:2px solid #1A1A1A;display:flex;align-items:center;justify-content:center;color:#6B6B6B;font-size:12px}

html,body{margin:0;width:390px;min-height:844px}
</style>
</head>
<body>
<div class="sc-host" data-sc-name="Reader"><div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: rgb(10, 10, 10);">
  <button aria-label="نمایش یا پنهان کردن منو" style="position: absolute; inset: 0px; padding: 0px; border: 0px; background: rgb(10, 10, 10); display: flex; flex-direction: column; gap: 6px;">
    <span style="width: 390px; height: 560px; background: rgb(239, 239, 239); box-sizing: border-box; padding: 14px; display: grid; grid-template-columns: repeat(2, minmax(0px, 1fr)); grid-template-rows: 200px 150px 170px; gap: 8px;">
      <span class="pn" style="grid-column: span 2;">صفحه ۳ — پنل ۱</span>
      <span class="pn">پنل ۲</span>
      <span class="pn">پنل ۳</span>
      <span class="pn" style="grid-column: span 2;">پنل ۴</span>
    </span>
    <span style="width: 390px; height: 460px; background: rgb(239, 239, 239); box-sizing: border-box; padding: 14px; display: grid; grid-template-columns: repeat(3, minmax(0px, 1fr)); grid-template-rows: 180px 240px; gap: 8px;">
      <span class="pn">صفحه ۴</span>
      <span class="pn" style="grid-column: span 2;">پنل ۲</span>
      <span class="pn" style="grid-column: span 3;">پنل ۳</span>
    </span>
  </button>

  
    <div style="position: absolute; top: 0px; left: 0px; right: 0px; padding: 52px 12px 12px; background: rgba(10, 10, 10, 0.94); border-bottom: 1px solid rgb(38, 38, 38); display: flex; align-items: center; gap: 8px;">
      <a href="Main.html" aria-label="بازگشت" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: rgb(245, 245, 245);">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </a>
      <div style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0px;">
        <span style="font-size: 15px; font-weight: 900;">جوجوتسو کایسن</span>
        <span style="font-size: 12px; color: rgb(163, 163, 163);">چپتر ۲۴۲ · Flying High</span>
      </div>
      <div role="group" aria-label="زبان ترجمه" style="display: flex; background: rgb(30, 30, 30); border-radius: 10px; padding: 3px;">
        <button style="height: 32px; min-width: 40px; border: 0px; border-radius: 8px; font-size: 12px; font-weight: 700; background: rgb(224, 0, 0); color: rgb(255, 255, 255);">FA</button>
        <button style="height: 32px; min-width: 40px; border: 0px; border-radius: 8px; font-size: 12px; font-weight: 700; background: transparent; color: rgb(163, 163, 163);">EN</button>
      </div>
    </div>

    <div style="position: absolute; bottom: 0px; left: 0px; right: 0px; padding: 14px 16px 30px; background: rgba(10, 10, 10, 0.96); border-top: 1px solid rgb(38, 38, 38); display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <button aria-label="چپتر قبلی" style="width: 44px; height: 44px; border-radius: 12px; background: rgb(30, 30, 30); border: 0px; color: rgb(245, 245, 245); display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"></path></svg></button>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px;">
          <div style="height: 6px; border-radius: 3px; background: rgb(51, 51, 51); position: relative; overflow: hidden;">
            <div style="position: absolute; right: 0px; top: 0px; bottom: 0px; width: 17%; background: linear-gradient(270deg, rgb(142, 0, 0), rgb(255, 26, 26));"></div>
          </div>
          <div style="display: flex; justify-content: space-between; font-size: 11px; color: rgb(163, 163, 163);"><span>صفحه ۳ از ۱۸</span><span>۱۷٪</span></div>
        </div>
        <button aria-label="چپتر بعدی" style="width: 44px; height: 44px; border-radius: 12px; background: rgb(30, 30, 30); border: 0px; color: rgb(245, 245, 245); display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 6-6 6 6 6"></path></svg></button>
      </div>
      <div style="display: flex; justify-content: space-between;">
        <a href="Comments.html" style="flex-grow: 1; height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: rgb(229, 229, 229); font-size: 11px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"></path><path d="M8 9h8M8 12h5"></path></svg>۳۴۵ نظر</a>
        <button style="flex-grow: 1; height: 48px; background: none; border: 0px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: rgb(229, 229, 229); font-size: 11px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>نشان</button>
        <button style="flex-grow: 1; height: 48px; background: none; border: 0px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: rgb(229, 229, 229); font-size: 11px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"></path></svg>دانلود</button>
        <a href="ReaderSettings.html" style="flex-grow: 1; height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: rgb(229, 229, 229); font-size: 11px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path><circle cx="16" cy="7" r="2"></circle><circle cx="8" cy="17" r="2"></circle></svg>تنظیمات</a>
      </div>
    </div>
  </div></div>
</body>
</html>
