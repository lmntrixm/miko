<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>دیوار اشتراک</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>

body{margin:0;font-family:'Vazirmatn',sans-serif;background:#0A0A0A;color:#F5F5F5}
a{color:#FF4D4D;text-decoration:none}a:hover{color:#FF7A7A}
button{font-family:inherit;cursor:pointer}
.pn{background-color:#D6D6D6;border:2px solid #1A1A1A}

html,body{margin:0;width:390px;min-height:844px}
</style>
</head>
<body>
<div class="sc-host" data-sc-name="Paywall"><div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: rgb(10, 10, 10);">
  <div aria-hidden="true" style="position: absolute; inset: 0px; background: rgb(239, 239, 239); padding: 14px; box-sizing: border-box; display: grid; grid-template-columns: repeat(2, minmax(0px, 1fr)); grid-template-rows: 220px 180px 200px 180px; gap: 8px; filter: blur(9px);">
    <span class="pn" style="grid-column: span 2;"></span><span class="pn"></span><span class="pn"></span><span class="pn" style="grid-column: span 2;"></span><span class="pn"></span><span class="pn"></span>
  </div>
  <div style="position: absolute; inset: 0px; background: linear-gradient(rgba(10, 10, 10, 0.55) 0%, rgba(10, 10, 10, 0.92) 45%, rgb(10, 10, 10) 60%);"></div>

  <div style="position: absolute; top: 52px; left: 12px; right: 12px; display: flex; align-items: center; gap: 8px;">
    <a href="OrigDetail.html" aria-label="بازگشت" style="width: 44px; height: 44px; border-radius: 14px; background: rgba(0, 0, 0, 0.6); display: flex; align-items: center; justify-content: center; color: rgb(255, 255, 255);"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
    <span style="font-size: 14px; font-weight: 700;">جوجوتسو کایسن · چپتر ۲۴۲</span>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 34px; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;">
      <span style="width: 72px; height: 72px; border-radius: 24px; background: linear-gradient(135deg, rgb(142, 0, 0), rgb(230, 0, 0)); box-shadow: rgba(230, 0, 0, 0.45) 0px 8px 28px; display: flex; align-items: center; justify-content: center; color: rgb(255, 255, 255);">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="10" rx="3"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
      </span>
      <h1 style="margin: 0px; font-size: 22px; font-weight: 900;">ادامه این چپتر با اشتراک</h1>
      <p style="margin: 0px; font-size: 14px; line-height: 1.9; color: rgb(212, 212, 212);">۳ چپتر اول هر اثر رایگان است. با اشتراک، همه ۲۴۲ چپتر را به فارسی و انگلیسی بخوانید و دانلود کنید.</p>
    </div>

    <div role="radiogroup" aria-label="طرح اشتراک" style="display: grid; grid-template-columns: repeat(3, minmax(0px, 1fr)); gap: 8px;">
      
        <button role="radio" aria-checked="false" style="position: relative; height: 76px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: rgb(26, 26, 26); border: 1.5px solid rgb(42, 42, 42);">
          
          <span style="font-size: 14px; font-weight: 900; color: rgb(245, 245, 245);"><span class="sc-interp">یک ماهه</span></span>
          <span style="font-size: 12px; color: rgb(163, 163, 163);">[قیمت]</span>
        </button>
      
        <button role="radio" aria-checked="true" style="position: relative; height: 76px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: rgb(31, 11, 11); border: 1.5px solid rgb(224, 0, 0);">
          <span style="position: absolute; top: -10px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: rgb(224, 0, 0); color: rgb(255, 255, 255); white-space: nowrap;"><span class="sc-interp">محبوب</span></span>
          <span style="font-size: 14px; font-weight: 900; color: rgb(245, 245, 245);"><span class="sc-interp">سه ماهه</span></span>
          <span style="font-size: 12px; color: rgb(163, 163, 163);">[قیمت]</span>
        </button>
      
        <button role="radio" aria-checked="false" style="position: relative; height: 76px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: rgb(26, 26, 26); border: 1.5px solid rgb(42, 42, 42);">
          
          <span style="font-size: 14px; font-weight: 900; color: rgb(245, 245, 245);"><span class="sc-interp">سالانه</span></span>
          <span style="font-size: 12px; color: rgb(163, 163, 163);">[قیمت]</span>
        </button>
      
    </div>

    <a href="PaymentPending.html" style="height: 58px; border-radius: 20px; background: linear-gradient(90deg, rgb(160, 0, 0), rgb(255, 0, 0)); color: rgb(255, 255, 255); font-size: 17px; font-weight: 900; display: flex; align-items: center; justify-content: center;">خرید اشتراک و ادامه خواندن</a>
    <div style="display: flex; justify-content: space-between; font-size: 13px;">
      <a href="Reader.html" style="color: rgb(212, 212, 212); min-height: 36px; display: flex; align-items: center;">خواندن چپتر ۱ رایگان</a>
      <button style="background: none; border: 0px; color: rgb(163, 163, 163); font-size: 13px; min-height: 36px;">بازیابی خرید قبلی</button>
    </div>
  </div></div></div>
</body>
</html>
