<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>گزارش مشکل</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>

body{margin:0;font-family:'Vazirmatn',sans-serif;background:#121212;color:#F5F5F5}
a{color:#FF4D4D;text-decoration:none}a:hover{color:#FF7A7A}
button,textarea{font-family:inherit}
button{cursor:pointer}
textarea::placeholder{color:#8C8C8C}
.pn{background-color:#D6D6D6;border:2px solid #1A1A1A}

html,body{margin:0;width:390px;min-height:844px}
</style>
</head>
<body>
<div class="sc-host" data-sc-name="ReportProblem"><div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: rgb(18, 18, 18);">
  <div style="padding: 52px 12px 8px; display: flex; align-items: center; gap: 8px;">
    <a href="Reader.html" aria-label="بازگشت" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: rgb(245, 245, 245);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
    <h1 style="margin: 0px; font-size: 20px; font-weight: 900;">گزارش مشکل</h1>
  </div>
  <div style="padding: 4px 20px 0px; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 16px; background: rgb(26, 26, 26); border: 1px solid rgb(38, 38, 38);">
      <span style="width: 54px; height: 72px; background: rgb(239, 239, 239); padding: 4px; box-sizing: border-box; display: grid; gap: 3px; grid-template-rows: 1fr 1fr;"><span class="pn"></span><span class="pn"></span></span>
      <span style="display: flex; flex-direction: column; gap: 2px;"><b style="font-size: 14px;">جوجوتسو کایسن · چپتر ۲۴۲</b><span style="font-size: 12px; color: rgb(163, 163, 163);">صفحه ۳ · فارسی · به‌صورت خودکار ضمیمه شد</span></span>
    </div>
    <span style="font-size: 14px; font-weight: 700;">مشکل چیست؟</span>
    <div style="display: flex; flex-wrap: wrap; gap: 8px;">
      <button style="height: 38px; padding: 0px 12px; border-radius: 12px; font-size: 13px; background: rgb(224, 0, 0); border: 0px; color: rgb(255, 255, 255); font-weight: 700;"><span class="sc-interp">ترجمه اشتباه</span></button><button style="height: 38px; padding: 0px 12px; border-radius: 12px; font-size: 13px; background: rgb(30, 30, 30); border: 1px solid rgb(46, 46, 46); color: rgb(212, 212, 212);"><span class="sc-interp">صفحه خراب یا جاافتاده</span></button><button style="height: 38px; padding: 0px 12px; border-radius: 12px; font-size: 13px; background: rgb(30, 30, 30); border: 1px solid rgb(46, 46, 46); color: rgb(212, 212, 212);"><span class="sc-interp">ترتیب صفحات</span></button><button style="height: 38px; padding: 0px 12px; border-radius: 12px; font-size: 13px; background: rgb(30, 30, 30); border: 1px solid rgb(46, 46, 46); color: rgb(212, 212, 212);"><span class="sc-interp">کیفیت تصویر پایین</span></button><button style="height: 38px; padding: 0px 12px; border-radius: 12px; font-size: 13px; background: rgb(30, 30, 30); border: 1px solid rgb(46, 46, 46); color: rgb(212, 212, 212);"><span class="sc-interp">زبان اشتباه</span></button><button style="height: 38px; padding: 0px 12px; border-radius: 12px; font-size: 13px; background: rgb(30, 30, 30); border: 1px solid rgb(46, 46, 46); color: rgb(212, 212, 212);"><span class="sc-interp">مورد دیگر</span></button>
    </div>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: rgb(212, 212, 212);">توضیح
      <textarea placeholder="مثلاً: در حباب دوم، نام شخصیت اشتباه ترجمه شده" style="height: 110px; border-radius: 16px; background: rgb(30, 30, 30); border: 1px solid rgb(46, 46, 46); color: rgb(245, 245, 245); padding: 12px 14px; font-size: 14px; resize: none; outline: none;"></textarea>
    </label>
    <button style="height: 48px; border-radius: 14px; background: none; border: 1px dashed rgb(68, 68, 68); color: rgb(212, 212, 212); font-size: 13px;">+ افزودن اسکرین‌شات</button>
  </div>
  <div style="position: absolute; left: 20px; right: 20px; bottom: 30px;">
    <button style="width: 100%; height: 56px; border-radius: 18px; border: 0px; font-size: 16px; font-weight: 900; background: linear-gradient(90deg, rgb(142, 0, 0), rgb(230, 0, 0)); color: rgb(255, 255, 255);"><span class="sc-interp">ارسال گزارش</span></button>
  </div></div></div>
</body>
</html>
