<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>ورود — روشن</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>

body{margin:0;font-family:'Vazirmatn',sans-serif;background:#FFFFFF;color:#1A1414}
a{color:#B00000;text-decoration:none}a:hover{color:#8E0000}
button,input{font-family:inherit}
input::placeholder{color:#7A7171}
.ph{background-color:#E4E0E0;background-image:repeating-linear-gradient(135deg,rgba(0,0,0,.06) 0 6px,transparent 6px 14px)}

html,body{margin:0;width:390px;min-height:844px}
</style>
</head>
<body>
<div class="sc-host" data-sc-name="LightAuthLogin"><div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: rgb(255, 255, 255);">
  <div aria-hidden="true" style="position: absolute; inset: -20px; display: grid; grid-template-columns: repeat(2, minmax(0px, 1fr)); gap: 16px; transform: rotate(-4deg);">
    <span class="ph" style="height: 300px; border-radius: 22px;"></span><span class="ph" style="height: 340px; border-radius: 22px;"></span><span class="ph" style="height: 300px; border-radius: 22px;"></span><span class="ph" style="height: 260px; border-radius: 22px;"></span><span class="ph" style="height: 300px; border-radius: 22px;"></span><span class="ph" style="height: 300px; border-radius: 22px;"></span>
  </div>
  <div style="position: absolute; inset: 0px; background: rgba(246, 244, 244, 0.55);"></div>
  <form style="position: absolute; top: 250px; left: 26px; right: 26px; padding: 30px 22px 22px; border-radius: 42px; background: rgba(255, 255, 255, 0.95); border: 1px solid rgb(200, 16, 46); display: flex; flex-direction: column; gap: 20px;">
    <p style="margin: 0px; font-size: 13px; color: rgb(26, 20, 20);">برای استفاده از برنامه ایمیل و پسورد خود را وارد کنید:</p>
    <label style="position: relative; height: 62px; border-radius: 26px; border: 1px solid rgb(200, 16, 46); display: flex; align-items: center; gap: 12px; padding: 0px 20px;">
      <span style="position: absolute; top: -11px; right: 22px; padding: 0px 8px; background: rgb(255, 255, 255); font-size: 13px;">ایمیل</span>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A1414" stroke-width="1.7" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="4"></rect><path d="m4 7 8 6 8-6"></path></svg>
      <input dir="ltr" type="email" value="jafariamirhossein30@gmail.com" style="flex-grow: 1; min-width: 0px; background: transparent; border: 0px; outline: none; color: rgb(74, 66, 66); font-size: 14px;">
    </label>
    <label style="position: relative; height: 62px; border-radius: 26px; border: 1px solid rgb(200, 16, 46); display: flex; align-items: center; gap: 12px; padding: 0px 20px;">
      <span style="position: absolute; top: -11px; right: 22px; padding: 0px 8px; background: rgb(255, 255, 255); font-size: 13px;">پسورد</span>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A1414" stroke-width="1.7" stroke-linejoin="round"><rect x="5" y="10" width="14" height="10" rx="3"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
      <input type="password" value="12345678" style="flex-grow: 1; min-width: 0px; background: transparent; border: 0px; outline: none; color: rgb(74, 66, 66); font-size: 14px; letter-spacing: 3px;">
    </label>
    <a href="LightHome.html" style="height: 58px; border-radius: 26px; background: linear-gradient(90deg, rgb(160, 0, 0), rgb(255, 0, 0)); color: rgb(255, 255, 255); font-size: 19px; font-weight: 900; display: flex; align-items: center; justify-content: center;">ورود</a>
    <div style="display: flex; justify-content: space-between; font-size: 13px;"><a href="LightForgotPassword.html" style="color: rgb(26, 20, 20);">رمز خود را فراموش کرده‌اید</a><a href="LightAuthSignup.html">ثبت نام</a></div>
  </form></div></div>
