<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>جستجوی بی‌نتیجه — روشن</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>

body{margin:0;font-family:'Vazirmatn',sans-serif;background:#F6F4F4;color:#1A1414}
a{color:#B00000;text-decoration:none}a:hover{color:#8E0000}
button,input{font-family:inherit;cursor:pointer}

html,body{margin:0;width:390px;min-height:844px}
</style>
</head>
<body>
<div class="sc-host" data-sc-name="LightNoResults"><div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: rgb(246, 244, 244);">
  <div style="padding: 60px 20px 0px; display: flex; flex-direction: column; gap: 16px;">
    <label style="height: 52px; border-radius: 16px; background: rgb(241, 238, 238); border: 1px solid rgb(224, 0, 0); display: flex; align-items: center; gap: 10px; padding: 0px 14px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B6262" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden;">جستجو</span>
      <input value="کاگوراباچ" style="flex-grow: 1; min-width: 0px; background: transparent; border: 0px; outline: none; color: rgb(26, 20, 20); font-size: 15px;">
    </label>
    <span style="font-size: 14px; color: rgb(107, 98, 98);">نتیجه‌ای برای «کاگوراباچ» پیدا نشد</span>
  </div>
  <div style="padding: 24px 20px 0px; display: flex; flex-direction: column; gap: 18px;">
    <div style="padding: 18px; border-radius: 20px; background: rgb(255, 255, 255); border: 1px solid rgb(228, 224, 224); display: flex; flex-direction: column; gap: 10px;">
      <span style="font-size: 13px; color: rgb(107, 98, 98);">منظورتان این بود؟</span>
      <a href="LightDetail.html" style="display: flex; align-items: center; justify-content: space-between; color: rgb(26, 20, 20); font-size: 16px; font-weight: 900; min-height: 44px;">کاگوراباچی <span style="font-size: 12px; color: rgb(176, 0, 0); font-weight: 500;">مشاهده ›</span></a>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: rgb(61, 53, 53);">
      <span style="font-weight: 700; color: rgb(26, 20, 20);">پیشنهادها</span>
      <span>· املای نام را بررسی کنید یا نام انگلیسی را امتحان کنید</span>
      <span>· فیلترهای «فارسی» و «مانگا» را بردارید</span>
    </div>
    <div style="padding: 18px; border-radius: 20px; background: rgb(253, 236, 236); border: 1px dashed rgb(245, 184, 184); display: flex; flex-direction: column; gap: 10px;">
      <span style="font-size: 15px; font-weight: 900;">اثری که دنبالش هستید را نداریم؟</span>
      <span style="font-size: 13px; line-height: 1.9; color: rgb(61, 53, 53);">درخواست ثبت کنید؛ وقتی اضافه شد خبرتان می‌کنیم.</span>
      <button style="height: 46px; border-radius: 14px; background: rgb(224, 0, 0); border: 0px; color: rgb(255, 255, 255); font-size: 14px; font-weight: 700;">درخواست افزودن اثر</button>
    </div>
  </div></div></div>
</body>
</html>
