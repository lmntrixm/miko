<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>درخواست اثر جدید — روشن</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>

body{margin:0;font-family:'Vazirmatn',sans-serif;background:#F6F4F4;color:#1A1414}
a{color:#B00000;text-decoration:none}a:hover{color:#8E0000}
button,input,textarea{font-family:inherit}
button{cursor:pointer}
input::placeholder,textarea::placeholder{color:#7A7171}
.ph{background-color:#E4E0E0;background-image:repeating-linear-gradient(135deg,rgba(0,0,0,.05) 0 6px,transparent 6px 14px)}

html,body{margin:0;width:390px;min-height:844px}
</style>
</head>
<body>
<div class="sc-host" data-sc-name="LightRequestTitle"><div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: rgb(246, 244, 244);">
  <div style="padding: 52px 12px 8px; display: flex; align-items: center; gap: 8px;">
    <a href="LightHome.html" aria-label="بازگشت" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: rgb(26, 20, 20);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
    <h1 style="margin: 0px; font-size: 20px; font-weight: 900;">درخواست اثر جدید</h1>
  </div>
  <div style="padding: 6px 20px 0px; display: flex; flex-direction: column; gap: 16px;">
    <p style="margin: 0px; font-size: 13px; line-height: 1.9; color: rgb(107, 98, 98);">اثری که دوست دارید در اپ نیست؟ درخواست بدهید؛ آثار پرطرفدار زودتر اضافه می‌شوند.</p>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: rgb(61, 53, 53);">نام اثر (فارسی یا انگلیسی)
      <input placeholder="مثلاً Chainsaw Man" value="" style="height: 50px; border-radius: 16px; background: rgb(241, 238, 238); border: 1px solid rgb(214, 208, 208); color: rgb(26, 20, 20); padding: 0px 14px; font-size: 14px; outline: none;">
    </label>
    <div style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: rgb(61, 53, 53);">نوع
      <div style="display: flex; gap: 8px;"><button style="flex-grow: 1; height: 42px; border-radius: 12px; font-size: 13px; background: rgb(224, 0, 0); border: 0px; color: rgb(255, 255, 255); font-weight: 700;"><span class="sc-interp">مانگا</span></button><button style="flex-grow: 1; height: 42px; border-radius: 12px; font-size: 13px; background: rgb(241, 238, 238); border: 1px solid rgb(214, 208, 208); color: rgb(61, 53, 53);"><span class="sc-interp">مانهوا</span></button><button style="flex-grow: 1; height: 42px; border-radius: 12px; font-size: 13px; background: rgb(241, 238, 238); border: 1px solid rgb(214, 208, 208); color: rgb(61, 53, 53);"><span class="sc-interp">کامیک</span></button></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: rgb(61, 53, 53);">زبان مورد نیاز
      <div style="display: flex; gap: 8px;"><button style="flex-grow: 1; height: 42px; border-radius: 12px; font-size: 13px; background: rgb(224, 0, 0); border: 0px; color: rgb(255, 255, 255); font-weight: 700;"><span class="sc-interp">فارسی</span></button><button style="flex-grow: 1; height: 42px; border-radius: 12px; font-size: 13px; background: rgb(241, 238, 238); border: 1px solid rgb(214, 208, 208); color: rgb(61, 53, 53);"><span class="sc-interp">انگلیسی</span></button><button style="flex-grow: 1; height: 42px; border-radius: 12px; font-size: 13px; background: rgb(241, 238, 238); border: 1px solid rgb(214, 208, 208); color: rgb(61, 53, 53);"><span class="sc-interp">هر دو</span></button></div>
    </div>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: rgb(61, 53, 53);">توضیح (اختیاری)
      <textarea placeholder="از کدام چپتر به بعد؟ لینک رسمی ناشر؟" style="height: 80px; border-radius: 16px; background: rgb(241, 238, 238); border: 1px solid rgb(214, 208, 208); color: rgb(26, 20, 20); padding: 12px 14px; font-size: 14px; resize: none; outline: none;"></textarea>
    </label>
    <span style="font-size: 14px; font-weight: 900; margin-top: 4px;">درخواست‌های پرطرفدار</span>
    
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 16px; background: rgb(255, 255, 255); border: 1px solid rgb(228, 224, 224);">
        <span class="ph" style="width: 40px; height: 54px; border-radius: 8px; flex-shrink: 0;"></span>
        <span style="flex-grow: 1; display: flex; flex-direction: column;"><span style="font-size: 14px; font-weight: 700;"><span class="sc-interp">Chainsaw Man</span></span><span style="font-size: 11px; color: rgb(107, 98, 98);"><span class="sc-interp">۴۱۲</span> رأی · <span class="sc-interp">در حال بررسی</span></span></span>
        <button style="height: 36px; padding: 0px 12px; border-radius: 10px; font-size: 12px; background: rgb(231, 227, 227); border: 0px; color: rgb(26, 20, 20);"><span class="sc-interp">+ رأی</span></button>
      </div>
    
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 16px; background: rgb(255, 255, 255); border: 1px solid rgb(228, 224, 224);">
        <span class="ph" style="width: 40px; height: 54px; border-radius: 8px; flex-shrink: 0;"></span>
        <span style="flex-grow: 1; display: flex; flex-direction: column;"><span style="font-size: 14px; font-weight: 700;"><span class="sc-interp">Blue Lock</span></span><span style="font-size: 11px; color: rgb(107, 98, 98);"><span class="sc-interp">۲۸۷</span> رأی · <span class="sc-interp">در صف ترجمه</span></span></span>
        <button style="height: 36px; padding: 0px 12px; border-radius: 10px; font-size: 12px; background: rgb(231, 227, 227); border: 0px; color: rgb(26, 20, 20);"><span class="sc-interp">+ رأی</span></button>
      </div>
    
  </div>
  <div style="position: absolute; left: 20px; right: 20px; bottom: 30px;">
    <button style="width: 100%; height: 56px; border-radius: 18px; border: 0px; font-size: 16px; font-weight: 900; background: rgb(239, 214, 214); color: rgb(122, 113, 113);"><span class="sc-interp">ثبت درخواست</span></button>
  </div></div></div>
</body>
</html>
