<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>پشتیبانی و سؤالات متداول — روشن</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>

body{margin:0;font-family:'Vazirmatn',sans-serif;background:#F6F4F4;color:#1A1414}
a{color:#B00000;text-decoration:none}a:hover{color:#8E0000}
button,input{font-family:inherit;cursor:pointer}
input::placeholder{color:#7A7171}

html,body{margin:0;width:390px;min-height:844px}
</style>
</head>
<body>
<div class="sc-host" data-sc-name="LightHelpCenter"><div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: rgb(246, 244, 244);">
  <div style="padding: 52px 12px 8px; display: flex; align-items: center; gap: 8px;">
    <a href="LightProfile.html" aria-label="بازگشت" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: rgb(26, 20, 20);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
    <h1 style="margin: 0px; font-size: 20px; font-weight: 900;">پشتیبانی</h1>
  </div>
  <div style="padding: 4px 20px 0px; display: flex; flex-direction: column; gap: 14px;">
    <label style="height: 50px; border-radius: 16px; background: rgb(241, 238, 238); border: 1px solid rgb(214, 208, 208); display: flex; align-items: center; gap: 10px; padding: 0px 14px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B6262" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden;">جستجو در راهنما</span>
      <input placeholder="سؤالتان را بنویسید…" style="flex-grow: 1; min-width: 0px; background: transparent; border: 0px; outline: none; color: rgb(26, 20, 20); font-size: 14px;">
    </label>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0px, 1fr)); gap: 10px;">
      <a href="LightReportProblem.html" style="padding: 14px; border-radius: 16px; background: rgb(253, 236, 236); border: 1px solid rgb(245, 184, 184); color: rgb(26, 20, 20); display: flex; flex-direction: column; gap: 4px;"><b style="font-size: 14px;">گزارش مشکل</b><span style="font-size: 11px; color: rgb(61, 53, 53);">ترجمه اشتباه، صفحه خراب</span></a>
      <a href="LightPaymentHistory.html" style="padding: 14px; border-radius: 16px; background: rgb(255, 255, 255); border: 1px solid rgb(228, 224, 224); color: rgb(26, 20, 20); display: flex; flex-direction: column; gap: 4px;"><b style="font-size: 14px;">مشکل پرداخت</b><span style="font-size: 11px; color: rgb(107, 98, 98);">پیگیری با کد تراکنش</span></a>
    </div>
    <span style="font-size: 15px; font-weight: 900;">سؤالات متداول</span>
    <div style="border-radius: 18px; background: rgb(255, 255, 255); border: 1px solid rgb(228, 224, 224); overflow: hidden;">
      
        <div style="border-bottom: 1px solid rgb(228, 224, 224);">
          <button aria-expanded="true" style="width: 100%; min-height: 52px; padding: 0px 16px; display: flex; align-items: center; gap: 10px; background: none; border: 0px; color: rgb(26, 20, 20); font-size: 14px; text-align: right;"><span style="flex-grow: 1;"><span class="sc-interp">پول کم شد ولی اشتراک فعال نشد</span></span><span style="color: rgb(176, 0, 0); font-size: 18px;"><span class="sc-interp">−</span></span></button>
          <p style="margin: 0px; padding: 0px 16px 14px; font-size: 13px; line-height: 1.9; color: rgb(61, 53, 53);"><span class="sc-interp">اگر تا ۲ دقیقه فعال نشد، از «تاریخچه پرداخت‌ها» وضعیت را ببینید. تراکنش ناموفق حداکثر تا ۷۲ ساعت توسط بانک برگشت داده می‌شود.</span></p>
        </div>
      
        <div style="border-bottom: 1px solid rgb(228, 224, 224);">
          <button aria-expanded="false" style="width: 100%; min-height: 52px; padding: 0px 16px; display: flex; align-items: center; gap: 10px; background: none; border: 0px; color: rgb(26, 20, 20); font-size: 14px; text-align: right;"><span style="flex-grow: 1;"><span class="sc-interp">چطور بین فارسی و انگلیسی جابه‌جا شوم؟</span></span><span style="color: rgb(176, 0, 0); font-size: 18px;"><span class="sc-interp">+</span></span></button>
          
        </div>
      
        <div style="border-bottom: 1px solid rgb(228, 224, 224);">
          <button aria-expanded="false" style="width: 100%; min-height: 52px; padding: 0px 16px; display: flex; align-items: center; gap: 10px; background: none; border: 0px; color: rgb(26, 20, 20); font-size: 14px; text-align: right;"><span style="flex-grow: 1;"><span class="sc-interp">دانلودها کجا ذخیره می‌شوند؟</span></span><span style="color: rgb(176, 0, 0); font-size: 18px;"><span class="sc-interp">+</span></span></button>
          
        </div>
      
        <div style="border-bottom: 1px solid rgb(228, 224, 224);">
          <button aria-expanded="false" style="width: 100%; min-height: 52px; padding: 0px 16px; display: flex; align-items: center; gap: 10px; background: none; border: 0px; color: rgb(26, 20, 20); font-size: 14px; text-align: right;"><span style="flex-grow: 1;"><span class="sc-interp">چپتر جدید کی منتشر می‌شود؟</span></span><span style="color: rgb(176, 0, 0); font-size: 18px;"><span class="sc-interp">+</span></span></button>
          
        </div>
      
        <div style="border-bottom: 1px solid rgb(228, 224, 224);">
          <button aria-expanded="false" style="width: 100%; min-height: 52px; padding: 0px 16px; display: flex; align-items: center; gap: 10px; background: none; border: 0px; color: rgb(26, 20, 20); font-size: 14px; text-align: right;"><span style="flex-grow: 1;"><span class="sc-interp">چطور حسابم را حذف کنم؟</span></span><span style="color: rgb(176, 0, 0); font-size: 18px;"><span class="sc-interp">+</span></span></button>
          
        </div>
      
    </div>
    <span style="font-size: 12px; color: rgb(107, 98, 98); text-align: center;">پاسخ نگرفتید؟ ایمیل: [ایمیل پشتیبانی] · پاسخ‌گویی تا ۲۴ ساعت · <a href="LightLegal.html">قوانین و حریم خصوصی</a></span>
  </div></div></div>
</body>
</html>
