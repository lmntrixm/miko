<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>نظرات چپتر — روشن</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>

body{margin:0;font-family:'Vazirmatn',sans-serif;background:#F6F4F4;color:#1A1414}
a{color:#B00000;text-decoration:none}a:hover{color:#8E0000}
button,input{font-family:inherit;cursor:pointer}
input::placeholder{color:#7A7171}

html,body{margin:0;width:390px;min-height:844px}
</style>
</head>
<body>
<div class="sc-host" data-sc-name="LightComments"><div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: rgb(246, 244, 244);">
  <div style="padding: 52px 12px 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgb(231, 227, 227);">
    <a href="LightReader.html" aria-label="بازگشت" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: rgb(26, 20, 20);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
    <div style="flex-grow: 1; display: flex; flex-direction: column;">
      <h1 style="margin: 0px; font-size: 17px; font-weight: 900;">نظرات</h1>
      <span style="font-size: 12px; color: rgb(107, 98, 98);">جوجوتسو کایسن · چپتر ۲۴۲ · ۳۴۵ نظر</span>
    </div>
  </div>

  <div style="padding: 14px 20px 0px; display: flex; gap: 8px;">
    
      <button style="height: 36px; padding: 0px 16px; border-radius: 10px; font-size: 13px; background: rgb(224, 0, 0); border: 0px; color: rgb(255, 255, 255); font-weight: 700;"><span class="sc-interp">محبوب‌ترین</span></button>
    
      <button style="height: 36px; padding: 0px 16px; border-radius: 10px; font-size: 13px; background: rgb(241, 238, 238); border: 1px solid rgb(214, 208, 208); color: rgb(61, 53, 53);"><span class="sc-interp">جدیدترین</span></button>
    
  </div>

  <div style="padding: 14px 20px 0px; display: flex; flex-direction: column; gap: 12px;">
    
      <article style="padding: 14px; border-radius: 18px; background: rgb(255, 255, 255); display: flex; flex-direction: column; gap: 10px; border: 1px solid rgb(245, 184, 184);">
        <div style="display: flex; gap: 10px; align-items: center;">
          <span style="width: 38px; height: 38px; border-radius: 12px; background: rgb(122, 31, 31); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 15px; color: rgb(255, 255, 255); flex-shrink: 0;"><span class="sc-interp">س</span></span>
          <span style="flex-grow: 1; display: flex; flex-direction: column;">
            <span style="font-size: 14px; font-weight: 700;"><span class="sc-interp">سارا م.</span></span>
            <span style="font-size: 11px; color: rgb(107, 98, 98);"><span class="sc-interp">۲ ساعت پیش</span></span>
          </span>
          <button aria-label="گزارش نظر" style="width: 40px; height: 40px; background: none; border: 0px; color: rgb(122, 113, 113); display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M5 21V4h12l-2 4 2 4H5"></path></svg></button>
        </div>
        
        
          <p style="margin: 0px; font-size: 14px; line-height: 1.9; color: rgb(42, 34, 34);"><span class="sc-interp">ترجمه این چپتر خیلی روان بود، مرسی از تیم ترجمه. صحنه آخر فوق‌العاده بود!</span></p>
        
        <div style="display: flex; gap: 16px; align-items: center;">
          <button style="min-height: 36px; background: none; border: 0px; color: rgb(208, 0, 0); display: flex; align-items: center; gap: 5px; font-size: 13px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="#D00000" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg><span class="sc-interp">۱۲۹</span></button>
          <a href="LightCommentThread.html" style="min-height: 36px; display: flex; align-items: center; color: rgb(74, 66, 66); font-size: 13px;">پاسخ (<span class="sc-interp">۱۴</span>)</a>
        </div>
      </article>
    
      <article style="padding: 14px; border-radius: 18px; background: rgb(255, 255, 255); display: flex; flex-direction: column; gap: 10px; border: 1px solid rgb(228, 224, 224);">
        <div style="display: flex; gap: 10px; align-items: center;">
          <span style="width: 38px; height: 38px; border-radius: 12px; background: rgb(58, 58, 90); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 15px; color: rgb(255, 255, 255); flex-shrink: 0;"><span class="sc-interp">ر</span></span>
          <span style="flex-grow: 1; display: flex; flex-direction: column;">
            <span style="font-size: 14px; font-weight: 700;"><span class="sc-interp">رضا ک.</span></span>
            <span style="font-size: 11px; color: rgb(107, 98, 98);"><span class="sc-interp">۵ ساعت پیش</span></span>
          </span>
          <button aria-label="گزارش نظر" style="width: 40px; height: 40px; background: none; border: 0px; color: rgb(122, 113, 113); display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M5 21V4h12l-2 4 2 4H5"></path></svg></button>
        </div>
        
          <button style="height: 44px; border-radius: 12px; border: 1px dashed rgb(245, 184, 184); background: rgb(253, 236, 236); color: rgb(158, 0, 0); font-size: 13px;">این نظر حاوی اسپویل است — برای نمایش بزنید</button>
        
        
        <div style="display: flex; gap: 16px; align-items: center;">
          <button style="min-height: 36px; background: none; border: 0px; color: rgb(74, 66, 66); display: flex; align-items: center; gap: 5px; font-size: 13px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg><span class="sc-interp">۶۴</span></button>
          <a href="LightCommentThread.html" style="min-height: 36px; display: flex; align-items: center; color: rgb(74, 66, 66); font-size: 13px;">پاسخ (<span class="sc-interp">۳</span>)</a>
        </div>
      </article>
    
      <article style="padding: 14px; border-radius: 18px; background: rgb(255, 255, 255); display: flex; flex-direction: column; gap: 10px; border: 1px solid rgb(228, 224, 224);">
        <div style="display: flex; gap: 10px; align-items: center;">
          <span style="width: 38px; height: 38px; border-radius: 12px; background: rgb(47, 74, 58); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 15px; color: rgb(255, 255, 255); flex-shrink: 0;"><span class="sc-interp">N</span></span>
          <span style="flex-grow: 1; display: flex; flex-direction: column;">
            <span style="font-size: 14px; font-weight: 700;"><span class="sc-interp">Nima</span></span>
            <span style="font-size: 11px; color: rgb(107, 98, 98);"><span class="sc-interp">دیروز</span></span>
          </span>
          <button aria-label="گزارش نظر" style="width: 40px; height: 40px; background: none; border: 0px; color: rgb(122, 113, 113); display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M5 21V4h12l-2 4 2 4H5"></path></svg></button>
        </div>
        
        
          <p style="margin: 0px; font-size: 14px; line-height: 1.9; color: rgb(42, 34, 34);"><span class="sc-interp">کسی می‌دونه نسخه انگلیسی چپتر بعدی کی میاد؟</span></p>
        
        <div style="display: flex; gap: 16px; align-items: center;">
          <button style="min-height: 36px; background: none; border: 0px; color: rgb(74, 66, 66); display: flex; align-items: center; gap: 5px; font-size: 13px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg><span class="sc-interp">۳۱</span></button>
          <a href="LightCommentThread.html" style="min-height: 36px; display: flex; align-items: center; color: rgb(74, 66, 66); font-size: 13px;">پاسخ (<span class="sc-interp">۰</span>)</a>
        </div>
      </article>
    
  </div>

  <div style="position: absolute; left: 0px; right: 0px; bottom: 0px; background: rgb(255, 255, 255); border-top: 1px solid rgb(231, 227, 227); padding: 10px 14px 28px; display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; gap: 8px; align-items: center;">
      <label style="flex-grow: 1; height: 48px; border-radius: 14px; background: rgb(241, 238, 238); border: 1px solid rgb(214, 208, 208); display: flex; align-items: center; padding: 0px 14px;">
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden;">نوشتن نظر</span>
        <input placeholder="نظرت درباره این چپتر…" style="flex-grow: 1; min-width: 0px; background: transparent; border: 0px; outline: none; color: rgb(26, 20, 20); font-size: 14px;">
      </label>
      <button aria-label="ارسال" style="width: 48px; height: 48px; border-radius: 14px; border: 0px; background: linear-gradient(135deg, rgb(142, 0, 0), rgb(230, 0, 0)); color: rgb(255, 255, 255); display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 4 3 11l7 2 2 7z"></path></svg></button>
    </div>
    <button style="align-self: flex-start; min-height: 32px; background: none; border: 0px; color: rgb(74, 66, 66); font-size: 12px; display: flex; gap: 6px; align-items: center;">
      <span style="width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid rgb(138, 128, 128);"></span>علامت‌گذاری به عنوان اسپویل
    </button>
  </div></div></div>
</body>
</html>
