<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>خواننده پیشرفته — روشن</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>

body{margin:0;font-family:'Vazirmatn',sans-serif;background:#000;color:#1A1414}
a{color:#B00000;text-decoration:none}a:hover{color:#8E0000}
button{font-family:inherit;cursor:pointer}
.pn{background-color:#CFCFCF;background-image:repeating-linear-gradient(135deg,rgba(0,0,0,.05) 0 6px,transparent 6px 14px);display:flex;align-items:center;justify-content:center;color:#A89F9F;font-size:12px}
input[type=range]{accent-color:#E00000}

html,body{margin:0;width:390px;min-height:844px}
</style>
</head>
<body>
<div class="sc-host" data-sc-name="LightReaderWebtoon"><div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: rgb(0, 0, 0);">
  <div aria-hidden="true" style="position: absolute; inset: 0px; display: flex; flex-direction: column; gap: 0px;">
    <span class="pn" style="height: 300px;">پنل وبتون — <span class="sc-interp">متن فارسی</span></span>
    <span class="pn" style="height: 260px; background-color: rgb(74, 66, 66);">پنل بعدی · بدون فاصله</span>
    <span class="pn" style="height: 320px;">پنل سوم</span>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0px; background: rgba(255, 140, 40, 0.12); mix-blend-mode: multiply; pointer-events: none;"></div>
  <div aria-hidden="true" style="position: absolute; inset: 0px; background: rgba(0, 0, 0, 0.12); pointer-events: none;"></div>

  <div style="position: absolute; top: 0px; left: 0px; right: 0px; padding: 50px 12px 10px; background: rgba(255, 255, 255, 0.95); display: flex; align-items: center; gap: 8px;">
    <a href="LightHomeTypes.html" aria-label="بازگشت" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: rgb(255, 255, 255);"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
    <span style="flex-grow: 1; display: flex; flex-direction: column;"><span style="font-size: 14px; font-weight: 900;">سولو لولینگ</span><span style="font-size: 11px; color: rgb(107, 98, 98);">قسمت ۱۱۲ · حالت وبتون</span></span>
  </div>

  <div role="group" aria-label="زبان ترجمه" style="position: absolute; top: 118px; left: 50%; transform: translateX(-50%); display: flex; background: rgba(255, 255, 255, 0.95); border: 1px solid rgb(245, 184, 184); border-radius: 16px; padding: 4px; gap: 4px;">
    
      <button style="height: 36px; padding: 0px 14px; border: 0px; border-radius: 12px; font-size: 13px; background: rgb(224, 0, 0); color: rgb(255, 255, 255); font-weight: 700;"><span class="sc-interp">فارسی</span></button>
    
      <button style="height: 36px; padding: 0px 14px; border: 0px; border-radius: 12px; font-size: 13px; background: transparent; color: rgb(61, 53, 53);"><span class="sc-interp">EN</span></button>
    
      <button style="height: 36px; padding: 0px 14px; border: 0px; border-radius: 12px; font-size: 13px; background: transparent; color: rgb(61, 53, 53);"><span class="sc-interp">دوزبانه</span></button>
    
  </div>

  
    <div role="status" style="position: absolute; top: 178px; left: 20px; right: 20px; padding: 12px 14px; border-radius: 16px; background: rgba(255, 255, 255, 0.96); border: 1px solid rgb(228, 224, 224); display: flex; align-items: center; gap: 10px; font-size: 13px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#15803D" stroke-width="1.8" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"></path></svg>
      <span style="flex-grow: 1;">از پنل ۲۳ که روی گوشی دیگرتان ماندید ادامه دادیم</span>
      <button aria-label="بستن" style="width: 32px; height: 32px; background: none; border: 0px; color: rgb(107, 98, 98);">✕</button>
    </div>
  

  <div style="position: absolute; bottom: 0px; left: 0px; right: 0px; padding: 14px 18px 30px; background: rgba(255, 255, 255, 0.97); border-top: 1px solid rgb(228, 224, 224); display: flex; flex-direction: column; gap: 12px;">
    <label style="display: flex; align-items: center; gap: 12px; font-size: 12px; color: rgb(61, 53, 53);"><span style="width: 74px;">فیلتر شب</span><input type="range" min="0" max="100" value="35" style="flex-grow: 1;"><span style="width: 34px; text-align: left;"><span class="sc-interp">۳۵٪</span></span></label>
    <label style="display: flex; align-items: center; gap: 12px; font-size: 12px; color: rgb(61, 53, 53);"><span style="width: 74px;">روشنایی</span><input type="range" min="20" max="100" value="85" style="flex-grow: 1;"><span style="width: 34px; text-align: left;"><span class="sc-interp">۸۵٪</span></span></label>
    <div style="display: flex; gap: 8px; font-size: 11px; color: rgb(107, 98, 98); align-items: center;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5M8 11h6M11 8v6"></path></svg>
      دو بار ضربه یا دو انگشت برای بزرگ‌نمایی · قسمت بعدی از پیش بارگذاری شد
    </div>
  </div></div></div>
</body>
</html>
