<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>ورود به پنل ادمین — روشن</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>

body{margin:0;font-family:'Vazirmatn',sans-serif;background:#FFFFFF;color:#1A1414}
a{color:#B00000;text-decoration:none}a:hover{color:#8E0000}
button,input{font-family:inherit}
button{cursor:pointer}
input::placeholder{color:#7A7171}

html,body{margin:0;width:1440px;min-height:900px}
</style>
</head>
<body>
<div class="sc-host" data-sc-name="LightAdminLogin"><div dir="rtl" style="width: 1440px; height: 900px; display: flex; background: rgb(255, 255, 255); overflow: hidden;">
  <section style="width: 620px; flex-shrink: 0; display: flex; flex-direction: column; justify-content: center; padding: 0px 96px; box-sizing: border-box; gap: 22px;">
    <span style="width: 56px; height: 56px; border-radius: 18px; background: linear-gradient(135deg, rgb(142, 0, 0), rgb(230, 0, 0)); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 26px; color: rgb(255, 255, 255);">م</span>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <h1 style="margin: 0px; font-size: 30px; font-weight: 900;">ورود به پنل مدیریت</h1>
      <p style="margin: 0px; font-size: 14px; color: rgb(107, 98, 98);">فقط اعضای تیم با دسترسی تأییدشده</p>
    </div>
    
      <div style="display: flex; flex-direction: column; gap: 16px;">
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: rgb(61, 53, 53);">ایمیل سازمانی<input dir="ltr" value="amir@[domain]" style="height: 50px; border-radius: 12px; background: rgb(239, 236, 236); border: 1px solid rgb(214, 208, 208); color: rgb(26, 20, 20); padding: 0px 14px; font-size: 14px; outline: none;"></label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: rgb(61, 53, 53);">رمز عبور<input type="password" value="12345678" style="height: 50px; border-radius: 12px; background: rgb(239, 236, 236); border: 1px solid rgb(214, 208, 208); color: rgb(26, 20, 20); padding: 0px 14px; font-size: 14px; letter-spacing: 3px; outline: none;"></label>
        <button style="height: 52px; border-radius: 12px; border: 0px; background: linear-gradient(90deg, rgb(142, 0, 0), rgb(230, 0, 0)); color: rgb(255, 255, 255); font-size: 15px; font-weight: 900;">ادامه</button>
      </div>
    
    
    <span style="font-size: 12px; color: rgb(122, 113, 113); display: flex; gap: 6px; align-items: center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="10" width="14" height="10" rx="3"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>ورودها در گزارش فعالیت ثبت می‌شوند · IP: 5.123.44.12 · <a href="AdminMobile.html">نسخه موبایل پنل</a></span>
  </section>
  <section aria-hidden="true" style="flex-grow: 1; position: relative; background: linear-gradient(160deg, rgb(58, 0, 0), rgb(255, 255, 255) 70%); overflow: hidden;">
    <div style="position: absolute; inset: 60px; display: grid; grid-template-columns: repeat(4, minmax(0px, 1fr)); gap: 18px; transform: rotate(-8deg); opacity: 0.35;">
      <span style="height: 220px; border-radius: 22px; background: rgb(245, 184, 184);"></span><span style="height: 220px; border-radius: 22px; background: rgb(228, 224, 224);"></span><span style="height: 220px; border-radius: 22px; background: rgb(142, 0, 0);"></span><span style="height: 220px; border-radius: 22px; background: rgb(241, 238, 238);"></span><span style="height: 220px; border-radius: 22px; background: rgb(228, 224, 224);"></span><span style="height: 220px; border-radius: 22px; background: rgb(224, 0, 0);"></span><span style="height: 220px; border-radius: 22px; background: rgb(241, 238, 238);"></span><span style="height: 220px; border-radius: 22px; background: rgb(245, 184, 184);"></span><span style="height: 220px; border-radius: 22px; background: rgb(142, 0, 0);"></span><span style="height: 220px; border-radius: 22px; background: rgb(228, 224, 224);"></span><span style="height: 220px; border-radius: 22px; background: rgb(241, 238, 238);"></span><span style="height: 220px; border-radius: 22px; background: rgb(245, 184, 184);"></span>
    </div>
    <div style="position: absolute; left: 60px; bottom: 60px; display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 44px; font-weight: 900; line-height: 1.2;">۱٬۲۴۸ اثر<br>۳۸٬۹۱۲ چپتر</span>
      <span style="font-size: 14px; color: rgb(61, 53, 53);">در دو زبان فارسی و انگلیسی</span>
    </div>
  </section></div></div>
</body>
</html>
